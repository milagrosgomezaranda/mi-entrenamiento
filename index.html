const m=(id,n,img,note='')=>({id,n,img,note}); const f=(id,n,eq,sr,img,note='')=>({id,n,eq,sr,img,note,check:true});
const lower=[m('d1m1','Flexión y extensión articular',U.art,'Referencia visual de movilidad articular. El nombre original no identifica una única articulación.'),m('d1m2','Estocada profunda con balanceo',U.lunge,'Referencia del patrón de estocada; realizá el balanceo según la indicación de tu entrenador.'),m('d1m3','Balanceo frontal de piernas',U.legswing),m('d1m4','Rotaciones de cadera',U.hipcircle),m('d1m5','Movilidad dinámica de cadera 90/90',U.hip9090),m('d1m6','Rotaciones de rodillas',U.knee,'Si este recurso externo no carga, pedile a tu entrenador que confirme la variante de rotación de rodillas.')];
const upper=[m('d2m1','Aperturas horizontales de brazos',U.armcircles,'Referencia visual de movilidad de hombros; mantené el gesto horizontal indicado por tu entrenador.'),m('d2m2','Aperturas verticales de brazos',U.vertical,'12 repeticiones'),m('d2m3','Rotaciones de torso',U.torso),m('d2m4','Rotaciones de hombros hacia adelante y atrás',U.shoulder),m('d2m5','Rotación externa de hombros con mancuernas',U.extrot,'10 repeticiones · variante con mancuerna. Por tu antecedente de hombro, revisar con un profesional antes de cargar.')];
const days=[
{d:1,title:'Tren inferior',mob:lower,force:[f('d1f1','Sentadilla goblet con mancuerna','Mancuerna','3 × 10–12',U.goblet),f('d1f2','Peso muerto rumano con mancuernas','Mancuernas','3 × 10–12',U.rdl),f('d1f3','Elevación de cadera en el piso con corebag','Corebag','3 × 15',U.bridge,'El GIF muestra el patrón de puente de glúteos; en tu rutina se realiza con corebag.'),f('d1f4','Abducción de cadera en máquina','Máquina de abductores','3 × 12',U.abdmachine),f('d1f5','Sentadilla copa','Mancuerna','3 × 12',U.frontsquat,'Se mantiene separada de la goblet porque así figura en tu rutina.'),f('d1f6','Elevación de talones con mancuernas (gemelos)','Mancuernas','3 × 15',U.calf,'El GIF muestra el patrón de gemelos de pie; en tu rutina sostenés mancuernas.'),f('d1f7','Extensión de cuádriceps en máquina','Sillón de cuádriceps','No especificado',U.legext)]},
{d:2,title:'Tren superior',mob:upper,warning:true,force:[f('d2f1','Curl martillo con mancuernas','Mancuernas','3 × 15–20',U.hammer),f('d2f2','Around the World con mancuernas','Mancuernas','3 × 15',U.around,'El nombre admite variantes. La referencia es orientativa hasta confirmar con tu entrenador cuál realiza.'),f('d2f3','Curl de bíceps con mancuernas','Mancuernas','3 × 10–12',U.biceps),f('d2f4','Extensión de tríceps','Variante no especificada','3 × 10',U.triceps,'Referencia: extensión por encima de la cabeza. Confirmar variante con tu entrenador.'),f('d2f5','Press cerrado','Variante no especificada','3 × 10–12',U.closepress,'Referencia: press cerrado con mancuernas. Confirmar implemento/variante con tu entrenador.'),f('d2f6','Remo en máquina','Máquina de remo','No especificado',U.row),f('d2f7','Extensiones con mancuernas','Mancuernas','3 × 10–12',U.kickback,'El nombre original es ambiguo. Referencia: extensión de tríceps tipo patada; confirmar variante.') ]},
{d:3,title:'Full body',mob:[...lower.map(x=>({...x,id:'d3'+x.id.slice(2)})),...upper.map(x=>({...x,id:'d3'+x.id.slice(2)}))],force:[f('d3f1','Prensa de piernas a 45°','Prensa','3 × 10–12',U.legpress),f('d3f2','Extensión de cuádriceps en máquina','Sillón de cuádriceps','3 × 10–12',U.legext),f('d3f3','Elevación de cadera en el piso con corebag','Corebag','3 × 10–12',U.bridge,'Mismo ejercicio del Día 1; cambia el rango de repeticiones.'),f('d3f4','Abducción de cadera en polea','Polea + tobillera','No especificado',U.cableabd,'Abducción en polea; no es la máquina de abductores.'),f('d3f5','Sentadilla con mancuerna o corebag','Mancuerna o corebag','3 × 10–12',U.frontsquat,'Referencia con mancuerna; tu rutina permite mancuerna o corebag.'),f('d3f6','Curl de bíceps con mancuernas','Mancuernas','3 × 10',U.biceps),f('d3f7','Elevación de talones con mancuernas (gemelos)','Mancuernas','3 × 10–12',U.calf,'Mismo movimiento del Día 1; cambia el rango de repeticiones.') ]}

function visual(x){return `<div class="visual"><img src="${x.img}" alt="Demostración de ${x.n}" loading="lazy" onerror="this.parentElement.classList.add('fail');this.parentElement.innerHTML='No se pudo cargar la referencia visual. Verificá tu conexión a Internet.'"></div>${x.note?`<p class="note">${x.note}</p>`:''}`}
function card(x){return `<article class="card"><div class="top"><div class="title">${x.n}</div>${x.check?`<label class="check"><input type="checkbox" data-id="${x.id}"></label>`:''}</div>${x.eq?`<div class="meta"><span class="pill">${x.eq}</span><span class="pill">${x.sr}</span></div>`:''}${visual(x)}</article>`}
function section(title,body,open=true){return `<section class="section ${open?'':'closed'}"><button type="button" class="toggle"><span>${title}</span><span>−</span></button><div class="content">${body}</div></section>`}
function render(){document.querySelector('#days').innerHTML=days.map((d,i)=>`<div class="day ${i===0?'active':''}" data-day="${d.d}"><div class="hero"><h2>Día ${d.d} · ${d.title}</h2><p>${d.d===3?'Calentamiento combinado de Día 1 + Día 2':'Rutina según indicación del entrenador'}</p><div class="progress"><div class="bar"><div class="fill"></div></div><div class="count"></div></div></div>${d.warning?`<div class="warning"><strong>Precaución de hombro:</strong> Around the World, aperturas, press y rotaciones con carga no deben asumirse como seguros. Revisalos con un profesional de salud antes de realizarlos.</div>`:''}${section('Caminata general',card(m('walk'+d.d,'Caminar 10 a 15 minutos',U.walk)))}${section(d.d===3?'Movilidad específica · combinación Día 1 + Día 2':'Movilidad específica',d.mob.map(card).join(''))}${section('Fuerza',d.force.map(card).join(''))}${section('Abdominales',`<div class="pending">Pendiente: faltan los nombres exactos de los 2 abdominales indicados por tu entrenador.</div>`,false)}${section('Estiramientos finales',`<div class="pending">Pendiente: faltan los estiramientos exactos indicados por tu entrenador.</div>`,false)}</div>`).join(''); bind();load();update()}
function bind(){document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{let s=b.closest('.section');s.classList.toggle('closed');b.lastElementChild.textContent=s.classList.contains('closed')?'+':'−'});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.day').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector(`.day[data-day="${b.dataset.day}"]`).classList.add('active')});document.querySelectorAll('input[data-id]').forEach(c=>c.onchange=()=>{localStorage.setItem('mi-entrenamiento:'+c.dataset.id,c.checked?'1':'0');update()})}
function load(){document.querySelectorAll('input[data-id]').forEach(c=>c.checked=localStorage.getItem('mi-entrenamiento:'+c.dataset.id)==='1')}
function update(){days.forEach(d=>{let el=document.querySelector(`.day[data-day="${d.d}"]`),cs=[...el.querySelectorAll('input[data-id]')],done=cs.filter(c=>c.checked).length;el.querySelector('.count').textContent=`${done} de ${cs.length} ejercicios de fuerza completados`;el.querySelector('.fill').style.width=(cs.length?done/cs.length*100:0)+'%'})}
render();
