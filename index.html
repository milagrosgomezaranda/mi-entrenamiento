<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f7f5ef'><title>Mi Entrenamiento</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{max-width:760px;margin:auto;padding:16px 14px 90px}h1{font-size:28px;margin:8px 0 4px}.sub{color:#666;margin:0 0 16px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;top:0;background:#f7f5ef;padding:8px 0;z-index:10}.tab{border:1px solid #d8d5cd;background:#fff;border-radius:14px;padding:13px 6px;font-weight:750;font-size:15px}.tab.active{background:#171717;color:white}.progress{background:#fff;border:1px solid #ddd9d0;border-radius:16px;padding:12px 14px;margin:8px 0 14px;position:sticky;top:67px;z-index:9}.bar{height:8px;background:#e9e6de;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#171717;width:0;transition:.2s}.day{display:none}.day.active{display:block}details{background:#fff;border:1px solid #ddd9d0;border-radius:18px;margin:12px 0;overflow:hidden}summary{padding:17px;font-size:18px;font-weight:800;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}.section{padding:0 12px 12px}.card{border:1px solid #e0ddd5;border-radius:18px;padding:12px;margin:10px 0;background:#fff}.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.name{font-size:18px;font-weight:800;line-height:1.2}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pill{background:#f0f2e8;border-radius:99px;padding:6px 9px;font-size:13px}.done{width:44px;height:44px;border:1px solid #d7d4cc;border-radius:13px;display:grid;place-items:center;flex:0 0 auto}.done input{width:24px;height:24px}.media{margin-top:10px;background:#f1f0ec;border-radius:15px;min-height:210px;overflow:hidden;display:grid;place-items:center}.media img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain}.fallback{padding:28px;text-align:center;color:#666;font-size:14px}.note{font-size:12px;color:#6a675f;margin-top:7px}.warning{background:#fff4e5;border:1px solid #ecd4a8;border-radius:16px;padding:13px;margin:10px 0;font-size:14px;line-height:1.4}.pending{padding:18px;background:#f2f1ed;border-radius:14px;color:#666}.walk{padding:4px 2px 12px;font-size:16px}@media(max-width:420px){.app{padding:10px 10px 80px}h1{font-size:25px}.name{font-size:17px}.media{min-height:190px}.progress{top:65px}}
</style></head><body><main class='app'><h1>Mi Entrenamiento</h1><p class='sub'>Rutina de 3 días · guía visual para el gimnasio</p><div class='tabs'><button class='tab active' data-day='d1'>Día 1</button><button class='tab' data-day='d2'>Día 2</button><button class='tab' data-day='d3'>Día 3</button></div><div class='progress'><strong id='ptxt'>0 de 7 ejercicios completados</strong><div class='bar'><div class='fill' id='pfill'></div></div></div><div id='root'></div></main>
<script>
const VISUALS={
'ankle-circles':'https://shoulderexercise.weebly.com/uploads/1/4/2/1/142161349/arm-circles-women-frozen-shoulder-exercise-6cc21455cebf322d7565dfa5be_orig.gif',
'dumbbell-reverse-lunge':'https://cdnl.iconscout.com/lottie/premium/thumb/woman-doing-jumping-lunges-exercise-animation-gif-download-12206506.gif',
'standing-knee-hugs':'https://spineclinic.id/wp-content/uploads/2024/06/latihan-Leg-swings-untuk-dynamic-stretching.gif',
'hip-circles':'https://media.gettyimages.com/id/1402691473/vector/hip-circles-sport-exersice-silhouettes-of-woman-doing-exercise-workout-training.jpg?s=612x612&w=0&k=20&c=v9F8J7c2s4DqY4Gf9A6F3cBqA5tQ8o3K0q0YvF5gF7E=',
'90-90-hip-switch':'https://hips.hearstapps.com/hmg-prod/images/wh-graphic-border-sidebyside-mobility5-1653067275.png?resize=768%3A%2A',
'knee-circles':'https://spineclinic.id/wp-content/uploads/2024/06/latihan-Leg-swings-untuk-dynamic-stretching.gif',
'arm-horizontal':'https://shoulderexercise.weebly.com/uploads/1/4/2/1/142161349/arm-circles-women-frozen-shoulder-exercise-6cc21455cebf322d7565dfa5be_orig.gif',
'arm-vertical':'https://shoulderexercise.weebly.com/uploads/1/4/2/1/142161349/arm-circles-women-frozen-shoulder-exercise-6cc21455cebf322d7565dfa5be_orig.gif',
'standing-oblique-twist':'https://hips.hearstapps.com/hmg-prod/images/wh-graphic-border-sidebyside-mobility5-1653067275.png?resize=768%3A%2A',
'shoulder-circles':'https://shoulderexercise.weebly.com/uploads/1/4/2/1/142161349/arm-circles-women-frozen-shoulder-exercise-6cc21455cebf322d7565dfa5be_orig.gif',
'dumbbell-external-rotation':'https://shoulderexercise.weebly.com/uploads/1/4/2/1/142161349/arm-circles-women-frozen-shoulder-exercise-6cc21455cebf322d7565dfa5be_orig.gif',
'dumbbell-goblet-squat':'https://row.gymshark.com/_next/image?q=85&url=https%3A%2F%2Fimages.ctfassets.net%2F8urtyqugdt2l%2F4R34dGkHiaDQolsk8Vfog7%2Ffdc24151c20981e7566d067d1d027e79%2Fgoblet-squat-mobile.jpg&w=3840',
'dumbbell-romanian-deadlift':'https://quinobike.com/img/cms/image2-11-1.png',
'weighted-glute-bridge':'https://contents.mediadecathlon.com/p2399898/k%24dabb003f325a3482a63730510f4218bb/1920x0/2240pt3830/4480xcr3484/default.jpg?format=auto',
'machine-hip-abduction':'https://cdn.fily.jp/uploads/articles/main/f1f64025-0a2d-41ca-8ad1-a96dd15f2973.png',
'kettlebell-goblet-squat':'https://row.gymshark.com/_next/image?q=85&url=https%3A%2F%2Fimages.ctfassets.net%2F8urtyqugdt2l%2F4R34dGkHiaDQolsk8Vfog7%2Ffdc24151c20981e7566d067d1d027e79%2Fgoblet-squat-mobile.jpg&w=3840',
'standing-calf-raise':'https://media.gettyimages.com/id/1403732568/vector/weighted-calf-raises-exercise-woman-workout-fitness-aerobic-and-exercises-vector.jpg?s=612x612&w=0&k=20&c=1',
'leg-extension':'https://www.elleman.vn/app/uploads/2024/03/14/231446/Project-InVictus-tapgym-elleman.png',
'dumbbell-hammer-curl':'https://www.mensjournal.com/.image/NDI6MDAwMDAwMDAwOTYxMzM0/hammer-curl-4.jpg?profile=w2560&x=50&y=50',
'dumbbell-around-the-world':'https://shoulderexercise.weebly.com/uploads/1/4/2/1/142161349/arm-circles-women-frozen-shoulder-exercise-6cc21455cebf322d7565dfa5be_orig.gif',
'dumbbell-biceps-curl':'https://c.tenor.com/JOkZmNENGU0AAAAC/bicep-curl-biceps.gif',
'dumbbell-overhead-triceps-extension':'https://i0.wp.com/post.healthline.com/wp-content/uploads/2021/09/HL-01.07c.OverheadTricepsExtensionWithDumbbells.gif?h=840',
'dumbbell-close-grip-press':'https://s3.amazonaws.com/prod.skimble/assets/904784/image_iphone.jpg',
'machine-seated-row':'https://lafitness.files.wordpress.com/2015/08/how-to-use-the-row-machine-at-la-fitness.jpg',
'leg-press':'https://cdn.vergleich.org/v2/sites/2/45-grad-beinpresse.jpg?d=848x577&q=70',
'cable-hip-abduction':'https://app-media.fitbod.me/v2/63/images/landscape/0_960x540.jpg'
};
const routines={
d1:{title:'Día 1 · Tren inferior',mob:[['Flexión y extensión articular','ankle-circles'],['Estocada profunda con balanceo','dumbbell-reverse-lunge'],['Balanceo frontal de piernas','standing-knee-hugs'],['Rotaciones de cadera','hip-circles'],['Movilidad dinámica de cadera 90/90','90-90-hip-switch'],['Rotaciones de rodillas','knee-circles']],force:[['Sentadilla goblet con mancuerna','Mancuerna','3 × 10–12','dumbbell-goblet-squat'],['Peso muerto rumano con mancuernas','Mancuernas','3 × 10–12','dumbbell-romanian-deadlift'],['Elevación de cadera en el piso con corebag','Corebag','3 × 15','weighted-glute-bridge'],['Abducción de cadera en máquina','Máquina','3 × 12','machine-hip-abduction'],['Sentadilla copa','Mancuerna','3 × 12','kettlebell-goblet-squat'],['Elevación de talones con mancuernas (gemelos)','Mancuernas','3 × 15','standing-calf-raise'],['Extensión de cuádriceps en máquina','Máquina','No especificado','leg-extension']]},
d2:{title:'Día 2 · Tren superior',mob:[['Aperturas horizontales de brazos · 12 repeticiones','arm-horizontal'],['Aperturas verticales de brazos · 12 repeticiones','arm-vertical'],['Rotaciones de torso','standing-oblique-twist'],['Rotaciones de hombros hacia adelante y atrás','shoulder-circles'],['Rotación externa de hombros con mancuernas · 10 repeticiones','dumbbell-external-rotation']],force:[['Curl martillo con mancuernas','Mancuernas','3 × 15–20','dumbbell-hammer-curl'],['Around the World con mancuernas','Mancuernas','3 × 15','dumbbell-around-the-world'],['Curl de bíceps con mancuernas','Mancuernas','3 × 10–12','dumbbell-biceps-curl'],['Extensión de tríceps','Variante no especificada','3 × 10','dumbbell-overhead-triceps-extension'],['Press cerrado','Variante no especificada','3 × 10–12','dumbbell-close-grip-press'],['Remo en máquina','Máquina','No especificado','machine-seated-row'],['Extensiones con mancuernas','Mancuernas · variante no especificada','3 × 10–12','dumbbell-overhead-triceps-extension']]},
d3:{title:'Día 3 · Full body',mob:'combo',force:[['Prensa de piernas a 45°','Máquina','3 × 10–12','leg-press'],['Extensión de cuádriceps en máquina','Máquina','3 × 10–12','leg-extension'],['Elevación de cadera en el piso con corebag','Corebag','3 × 10–12','weighted-glute-bridge'],['Abducción de cadera en polea','Polea','No especificado','cable-hip-abduction'],['Sentadilla con mancuerna o corebag','Mancuerna o corebag','3 × 10–12','dumbbell-goblet-squat'],['Curl de bíceps con mancuernas','Mancuernas','3 × 10','dumbbell-biceps-curl'],['Elevación de talones con mancuernas (gemelos)','Mancuernas','3 × 10–12','standing-calf-raise']]}}
let current='d1';
function media(slug,label){const url=VISUALS[slug];return `<div class='media'><img src='${url}' alt='Guía visual: ${label}' loading='lazy' referrerpolicy='no-referrer' onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class='fallback' style='display:none'>No cargó la imagen. <a href='${url}' target='_blank' rel='noopener'>Abrir guía visual</a></div></div>`}
function mobCard(x){return `<div class='card'><div class='name'>${x[0]}</div>${media(x[1],x[0])}</div>`}
function forceCard(x,i,day){let id=`${day}-f${i}`;return `<div class='card'><div class='top'><div><div class='name'>${x[0]}</div><div class='meta'><span class='pill'>${x[1]}</span><span class='pill'>${x[2]}</span></div></div><label class='done'><input type='checkbox' data-id='${id}'></label></div>${media(x[3],x[0])}${x[1].includes('no especificada')||x[0].includes('Around')?`<div class='note'>Referencia visual orientativa: confirmá la variante exacta con tu entrenador.</div>`:''}</div>`}
function render(){const root=document.getElementById('root');root.innerHTML='';Object.entries(routines).forEach(([k,r])=>{let mob=r.mob==='combo'?[...routines.d1.mob,...routines.d2.mob]:r.mob;let el=document.createElement('section');el.className='day '+(k===current?'active':'');el.id=k;el.innerHTML=`<h2>${r.title}</h2><details open><summary>Caminata general</summary><div class='section'><div class='walk'>Caminar de 10 a 15 minutos.</div></div></details><details open><summary>Movilidad específica</summary><div class='section'>${mob.map(mobCard).join('')}</div></details>${k==='d2'?`<div class='warning'><strong>Precaución de hombro:</strong> por tu antecedente de inestabilidad, Around the World, aperturas amplias, press y rotaciones con carga deben revisarse con un profesional de salud antes de realizarlos.</div>`:''}<details open><summary>Fuerza</summary><div class='section'>${r.force.map((x,i)=>forceCard(x,i,k)).join('')}</div></details><details><summary>Abdominales</summary><div class='section'><div class='pending'>Pendiente: faltan los 2 ejercicios exactos indicados por tu entrenador.</div></div></details><details><summary>Estiramientos finales</summary><div class='section'><div class='pending'>Pendiente: faltan los estiramientos exactos indicados por tu entrenador.</div></div></details>`;root.appendChild(el)});restore();progress()}
function restore(){document.querySelectorAll('input[data-id]').forEach(c=>{c.checked=localStorage.getItem('mi-ent-'+c.dataset.id)==='1';c.onchange=()=>{localStorage.setItem('mi-ent-'+c.dataset.id,c.checked?'1':'0');progress()}})}
function progress(){let boxes=[...document.querySelectorAll(`#${current} input[data-id]`)];let n=boxes.filter(x=>x.checked).length;document.getElementById('ptxt').textContent=`${n} de ${boxes.length} ejercicios completados`;document.getElementById('pfill').style.width=(boxes.length?n/boxes.length*100:0)+'%'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.day;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.day').forEach(x=>x.classList.toggle('active',x.id===current));progress();scrollTo({top:0,behavior:'smooth'})});
render();
</script></body></html>
