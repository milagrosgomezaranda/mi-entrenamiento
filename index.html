<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f7f5ef'><title>Mi Entrenamiento</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{max-width:760px;margin:auto;padding:16px 14px 90px}h1{font-size:28px;margin:8px 0 4px}.sub{color:#666;margin:0 0 16px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;top:0;background:#f7f5ef;padding:8px 0;z-index:10}.tab{border:1px solid #d8d5cd;background:#fff;border-radius:14px;padding:13px 6px;font-weight:750;font-size:15px}.tab.active{background:#171717;color:white}.progress{background:#fff;border:1px solid #ddd9d0;border-radius:16px;padding:12px 14px;margin:8px 0 14px;position:sticky;top:67px;z-index:9}.bar{height:8px;background:#e9e6de;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#171717;width:0;transition:.2s}.day{display:none}.day.active{display:block}details{background:#fff;border:1px solid #ddd9d0;border-radius:18px;margin:12px 0;overflow:hidden}summary{padding:17px;font-size:18px;font-weight:800;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}.section{padding:0 12px 12px}.card{border:1px solid #e0ddd5;border-radius:18px;padding:12px;margin:10px 0;background:#fff}.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.name{font-size:18px;font-weight:800;line-height:1.2}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pill{background:#f0f2e8;border-radius:99px;padding:6px 9px;font-size:13px}.done{width:44px;height:44px;border:1px solid #d7d4cc;border-radius:13px;display:grid;place-items:center;flex:0 0 auto}.done input{width:24px;height:24px}.media{margin-top:10px;background:#f1f0ec;border-radius:15px;min-height:210px;overflow:hidden;display:grid;place-items:center}.media img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain}.fallback{padding:28px;text-align:center;color:#666;font-size:14px}.guide{min-height:150px;width:100%;padding:24px;display:grid;place-items:center;text-align:center;color:#171717;font-weight:800;text-decoration:none;background:#eceae4}.note{font-size:12px;color:#6a675f;margin-top:7px}.warning{background:#fff4e5;border:1px solid #ecd4a8;border-radius:16px;padding:13px;margin:10px 0;font-size:14px;line-height:1.4}.pending{padding:18px;background:#f2f1ed;border-radius:14px;color:#666}.walk{padding:4px 2px 12px;font-size:16px}@media(max-width:420px){.app{padding:10px 10px 80px}h1{font-size:25px}.name{font-size:17px}.media{min-height:190px}.progress{top:65px}}
</style></head><body><main class='app'><h1>Mi Entrenamiento</h1><p class='sub'>Rutina de 3 días · guía visual para el gimnasio · requiere Internet para las animaciones</p><div class='tabs'><button class='tab active' data-day='d1'>Día 1</button><button class='tab' data-day='d2'>Día 2</button><button class='tab' data-day='d3'>Día 3</button></div><div class='progress'><strong id='ptxt'>0 de 7 ejercicios completados</strong><div class='bar'><div class='fill' id='pfill'></div></div></div><div id='root'></div></main>
<script>
const CATALOG='https://www.trainaiapp.com/media/exercises/catalog.json';
const routines={
d1:{title:'Día 1 · Tren inferior',mob:[['Flexión y extensión articular','supported-heel-to-toe-rock'],['Estocada profunda con balanceo','reverse-lunge'],['Balanceo frontal de piernas','high-knees'],['Rotaciones de cadera','quadruped-hip-extension'],['Movilidad dinámica de cadera 90/90','90-90-hip-switch'],['Rotaciones de rodillas','supported-deep-squat-mobility']],force:[['Sentadilla goblet con mancuerna','Mancuerna','3 × 10–12','dumbbell-goblet-squat'],['Peso muerto rumano con mancuernas','Mancuernas','3 × 10–12','dumbbell-romanian-deadlift'],['Elevación de cadera en el piso con corebag','Corebag','3 × 15','weighted-glute-bridge'],['Abducción de cadera en máquina','Máquina','3 × 12','machine-hip-abduction'],['Sentadilla copa','Mancuerna','3 × 12','kettlebell-goblet-squat'],['Elevación de talones con mancuernas (gemelos)','Mancuernas','3 × 15','standing-calf-raise'],['Extensión de cuádriceps en máquina','Máquina','No especificado','leg-extension']]},
d2:{title:'Día 2 · Tren superior',mob:[['Aperturas horizontales de brazos · 12 repeticiones','anchored-band-reverse-fly'],['Aperturas verticales de brazos · 12 repeticiones','seated-arm-reach'],['Rotaciones de torso','seated-thoracic-rotation'],['Rotaciones de hombros hacia adelante y atrás','shoulder-circles'],['Rotación externa de hombros con mancuernas · 10 repeticiones','band-external-rotation']],force:[['Curl martillo con mancuernas','Mancuernas','3 × 15–20','dumbbell-hammer-curl'],['Around the World con mancuernas','Mancuernas','3 × 15','dumbbell-around-the-world'],['Curl de bíceps con mancuernas','Mancuernas','3 × 10–12','dumbbell-biceps-curl'],['Extensión de tríceps','Variante no especificada','3 × 10','dumbbell-overhead-triceps-extension'],['Press cerrado','Variante no especificada','3 × 10–12','dumbbell-close-grip-press'],['Remo en máquina','Máquina','No especificado','machine-seated-row'],['Extensiones con mancuernas','Mancuernas · variante no especificada','3 × 10–12','dumbbell-overhead-triceps-extension']]},
d3:{title:'Día 3 · Full body',mob:'combo',force:[['Prensa de piernas a 45°','Máquina','3 × 10–12','leg-press'],['Extensión de cuádriceps en máquina','Máquina','3 × 10–12','leg-extension'],['Elevación de cadera en el piso con corebag','Corebag','3 × 10–12','weighted-glute-bridge'],['Abducción de cadera en polea','Polea','No especificado','cable-hip-abduction'],['Sentadilla con mancuerna o corebag','Mancuerna o corebag','3 × 10–12','dumbbell-goblet-squat'],['Curl de bíceps con mancuernas','Mancuernas','3 × 10','dumbbell-biceps-curl'],['Elevación de talones con mancuernas (gemelos)','Mancuernas','3 × 10–12','standing-calf-raise']]}}
let catalog=[],current='d1';
const aliases={
'dumbbell-goblet-squat':['dumbbell-goblet-squat','kettlebell-goblet-squat'],
'dumbbell-reverse-lunge':['dumbbell-reverse-lunge','reverse-lunge'],
'standing-knee-hugs':['standing-knee-hugs','high-knees'],
'weighted-glute-bridge':['weighted-glute-bridge','glute-bridge'],
'standing-calf-raise':['standing-calf-raise','machine-standing-calf-raise'],
'standing-oblique-twist':['standing-oblique-twist','russian-twist'],
'dumbbell-around-the-world':['dumbbell-around-the-world','arm-circles'],
'dumbbell-overhead-triceps-extension':['dumbbell-overhead-triceps-extension','seated-dumbbell-triceps-extension'],
'dumbbell-close-grip-press':['dumbbell-close-grip-press','close-grip-push-up'],
'cable-hip-abduction':['cable-hip-abduction','side-lying-hip-abduction']};
function findEx(slug){let keys=aliases[slug]||[slug];for(const k of keys){let x=catalog.find(e=>e.slug===k);if(x)return x}return null}
function media(slug,label){let ex=findEx(slug);let guide=`https://www.trainaiapp.com/exercises/${slug}/`;if(!ex)return `<div class='media'><a class='guide' href='${guide}' target='_blank' rel='noopener'>Ver demostración del movimiento</a></div>`;let url=ex.gifUrl||(ex.media&&ex.media.gif&&ex.media.gif.url);if(!url)return `<div class='media'><a class='guide' href='${guide}' target='_blank' rel='noopener'>Ver demostración del movimiento</a></div>`;return `<div class='media'><img src='${url}' alt='Demostración animada: ${label}' loading='lazy' onload="this.dataset.ok='1'" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><a class='guide' href='${guide}' target='_blank' rel='noopener' style='display:none'>Abrir demostración</a></div>`}
function mobCard(x){return `<div class='card'><div class='name'>${x[0]}</div>${media(x[1],x[0])}</div>`}
function forceCard(x,i,day){let id=`${day}-f${i}`;return `<div class='card'><div class='top'><div><div class='name'>${x[0]}</div><div class='meta'><span class='pill'>${x[1]}</span><span class='pill'>${x[2]}</span></div></div><label class='done'><input type='checkbox' data-id='${id}'></label></div>${media(x[3],x[0])}${x[1].includes('no especificada')||x[0].includes('Around')?`<div class='note'>Referencia visual orientativa: confirmá la variante exacta con tu entrenador.</div>`:''}</div>`}
function render(){const root=document.getElementById('root');root.innerHTML='';Object.entries(routines).forEach(([k,r])=>{let mob=r.mob==='combo'?[...routines.d1.mob,...routines.d2.mob]:r.mob;let el=document.createElement('section');el.className='day '+(k===current?'active':'');el.id=k;el.innerHTML=`<h2>${r.title}</h2><details open><summary>Caminata general</summary><div class='section'><div class='walk'>Caminar de 10 a 15 minutos.</div></div></details><details open><summary>Movilidad específica</summary><div class='section'>${mob.map(mobCard).join('')}</div></details>${k==='d2'?`<div class='warning'><strong>Precaución de hombro:</strong> por tu antecedente de inestabilidad, Around the World, aperturas amplias, press y rotaciones con carga deben revisarse con un profesional de salud antes de realizarlos.</div>`:''}<details open><summary>Fuerza</summary><div class='section'>${r.force.map((x,i)=>forceCard(x,i,k)).join('')}</div></details><details><summary>Abdominales</summary><div class='section'><div class='pending'>Pendiente: faltan los 2 ejercicios exactos indicados por tu entrenador.</div></div></details><details><summary>Estiramientos finales</summary><div class='section'><div class='pending'>Pendiente: faltan los estiramientos exactos indicados por tu entrenador.</div></div></details>`;root.appendChild(el)});restore();progress()}
function restore(){document.querySelectorAll('input[data-id]').forEach(c=>{c.checked=localStorage.getItem('mi-ent-'+c.dataset.id)==='1';c.onchange=()=>{localStorage.setItem('mi-ent-'+c.dataset.id,c.checked?'1':'0');progress()}})}
function progress(){let boxes=[...document.querySelectorAll(`#${current} input[data-id]`)];let n=boxes.filter(x=>x.checked).length;document.getElementById('ptxt').textContent=`${n} de ${boxes.length} ejercicios completados`;document.getElementById('pfill').style.width=(boxes.length?n/boxes.length*100:0)+'%'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.day;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.day').forEach(x=>x.classList.toggle('active',x.id===current));progress();scrollTo({top:0,behavior:'smooth'})});
fetch(CATALOG,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('catalog');return r.json()}).then(j=>{catalog=j.exercises||[];render()}).catch(()=>{catalog=[];render()});
</script></body></html>
